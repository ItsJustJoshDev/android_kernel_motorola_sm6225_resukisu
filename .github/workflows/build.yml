name: Build kernel (sm6225 + ReSukiSU)

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device codename"
        default: "guamna"
      defconfig:
        description: "Base defconfig"
        default: "vendor/bengal-perf_defconfig"
      hook_mode:
        description: "ReSukiSU hook mode: kprobes or manual"
        default: "manual"
      resukisu_ref:
        description: "ReSukiSU branch/tag (a wrong name silently stays on default)"
        default: "main"
      stock_boot_url:
        description: "Optional direct URL to your current boot.img (or commit it as stock/boot.img). Needed for the fastboot boot.img"
        default: ""
      release:
        description: "Publish a GitHub release with the outputs"
        type: boolean
        default: true

permissions:
  contents: write

env:
  CLANG_URL: "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/bd96dfe349c962681f0e5388af874c771ef96670/clang-r416183b.tar.gz"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev lz4 zip \
            cpio python3 curl git gcc-aarch64-linux-gnu

      - name: Toolchain (AOSP clang r416183b, same as build.config.common)
        run: |
          mkdir -p $HOME/clang
          curl -fL --retry 3 -o clang.tgz "$CLANG_URL"
          tar -xzf clang.tgz -C $HOME/clang
          $HOME/clang/bin/clang --version | head -1
          echo "$HOME/clang/bin" >> $GITHUB_PATH

      # Drop any *.patch into patches/ in your repo; applied in filename order.
      - name: Apply patches
        run: |
          shopt -s nullglob
          for p in patches/*.patch; do
            echo ">> $p"
            if git apply --check "$p" 2>/dev/null; then git apply "$p"
            else patch -p1 --no-backup-if-mismatch < "$p" || { echo "FAILED: $p"; exit 1; }
            fi
          done

      - name: Add ReSukiSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
            | bash -s "${{ inputs.resukisu_ref }}"
          git -C KernelSU branch --show-current || true
          ls drivers/kernelsu 2>/dev/null | head -3

      - name: Configure
        run: |
          A=arch/arm64/configs/vendor/ext_config
          ARGS="O=out ARCH=arm64 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu-"
          # Keep the version string identical to stock (no "+" from a dirty git tree),
          # otherwise prebuilt vendor modules refuse to load (vermagic mismatch).
          : > .scmversion
          if [ -f stock/config.gz ]; then
            echo "Using stock/config.gz as the base config"
            mkdir -p out && zcat stock/config.gz > out/.config
          else
            make $ARGS ${{ inputs.defconfig }}
            FR="$A/moto-bengal.config"
            [ -f "$A/${{ inputs.device }}-default.config" ] && FR="$FR $A/${{ inputs.device }}-default.config"
            FR="$FR $(ls configs/*.config 2>/dev/null | tr '\n' ' ')"
            scripts/kconfig/merge_config.sh -m -O out out/.config $FR
          fi
          # ONLY ReSukiSU options below. Everything else stays exactly as stock.
          if [ "${{ inputs.hook_mode }}" = "kprobes" ]; then
            scripts/config --file out/.config -e KSU -e KPROBES -e KPROBE_EVENTS
          else
            scripts/config --file out/.config -e KSU -e KSU_MANUAL_HOOK \
              -e KSU_MANUAL_HOOK_AUTO_INPUT_HOOK \
              -e KSU_MANUAL_HOOK_AUTO_SETUID_HOOK \
              -e KSU_MANUAL_HOOK_AUTO_INITRC_HOOK
          fi
          make $ARGS olddefconfig
          grep -E "CONFIG_(KSU|KPROBES|LTO_CLANG|CFI_CLANG|MODVERSIONS|LOCALVERSION)" out/.config || true
          echo "kernelrelease: $(make $ARGS -s kernelrelease)"

      - name: Build
        run: |
          make O=out ARCH=arm64 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- \
            -j$(nproc) Image.gz dtbs 2>&1 | tee build.log
          find out/arch/arm64/boot -maxdepth 1 -name 'Image*'

      - name: Package (AnyKernel3 for recovery)
        run: |
          mkdir -p dist
          cp out/arch/arm64/boot/Image.gz dist/
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3 ak3
          cd ak3 && rm -rf .git examples modules patch ramdisk/* 2>/dev/null; mkdir -p ramdisk patch modules
          cat > anykernel.sh <<'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=ReSukiSU kernel for guamna
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=guamna
          device.name2=guamna_retail
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          EOF
          cp ../out/arch/arm64/boot/Image.gz .
          zip -r9 ../dist/AnyKernel3-${{ inputs.device }}-run${{ github.run_number }}.zip . -x '.git*'

      # Optional: repack YOUR stock boot.img with the new kernel (keeps ramdisk, dtb, cmdline)
      - name: Build boot.img for fastboot (optional)
        run: |
          if [ -f stock/boot.img ]; then cp stock/boot.img stock_boot.img
          elif [ -n "${{ inputs.stock_boot_url }}" ]; then curl -fL -o stock_boot.img "${{ inputs.stock_boot_url }}"
          else echo "No stock boot.img provided, skipping boot.img"; exit 0; fi
          mkdir mkb
          curl -fL "https://android.googlesource.com/platform/system/tools/mkbootimg/+archive/refs/heads/main.tar.gz" | tar -xz -C mkb
          python3 mkb/unpack_bootimg.py --boot_img stock_boot.img --out bi --format=mkbootimg > mkargs.txt
          cat mkargs.txt
          grep -q -- '--dtb' mkargs.txt || { echo "Stock boot has no separate dtb (appended-dtb layout). Not supported, use the AnyKernel3 zip."; exit 1; }
          if file bi/kernel | grep -qi gzip; then K=out/arch/arm64/boot/Image.gz; else K=out/arch/arm64/boot/Image; fi
          sed -i "s|--kernel [^ ]*|--kernel $K|" mkargs.txt
          eval python3 mkb/mkbootimg.py $(cat mkargs.txt) -o dist/boot.img
          ls -l dist/boot.img

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-${{ inputs.device }}
          path: |
            dist/
            build.log

      - name: GitHub release
        if: ${{ inputs.release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.device }}-run${{ github.run_number }}
          name: ${{ inputs.device }} ReSukiSU kernel #${{ github.run_number }}
          body: |
            Hook mode: ${{ inputs.hook_mode }}, ReSukiSU ref: ${{ inputs.resukisu_ref }}, commit ${{ github.sha }}
            Flash AnyKernel3 zip in recovery, or `fastboot boot boot.img` to test first.
          files: |
            dist/AnyKernel3-*.zip
            dist/boot.img
            dist/Image.gz
            
